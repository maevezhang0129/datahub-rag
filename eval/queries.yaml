# Gold retrieval set for drr-rag.
#
# Provenance: hand-authored by the repository author against the frozen corpus
# in eval/corpus/. Each query was written after reading the target document,
# and deliberately paraphrases it rather than reusing its title words, so that
# the dense and lexical arms are genuinely tested against each other instead of
# both trivially matching a title.
#
# `relevant` lists documents that genuinely answer the query. Labels are
# document-level, not chunk-level: a hit counts if any chunk of a relevant
# document is retrieved.
#
# Known limitations, stated plainly:
#   - Labels are sparse. A query may have unlabelled relevant documents in the
#     corpus, so absolute recall is a lower bound. Relative comparison between
#     modes stays valid, since every mode is scored against the same labels.
#   - Targets are Wikipedia documents, which are longer and more definitional
#     than the OpenAlex abstracts that make up most of the corpus. The OpenAlex
#     documents therefore act mainly as distractors.
#   - `tags` records what each query is meant to probe, so per-tag breakdowns
#     can show where each mode wins.

